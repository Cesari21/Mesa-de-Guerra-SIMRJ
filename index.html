<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de Guerra</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#eef1f4;--fg:#1b2430;--panel:#fbfcfd;--line:#c5cdd6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--fg:#e6ebf0;--panel:#18202a;--line:#2f3a47;color-scheme:dark}}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
#home{margin:auto;text-align:center;padding:24px}
#home h1{font-size:40px;margin:0 0 6px}
#home p{margin:0;opacity:.7}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
input[type=text]{cursor:text;width:150px}
button.act{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--panel)}
.sw.sel{outline:2px solid var(--fg);outline-offset:2px}
#st{font-weight:600}
#hint{font-size:12px;opacity:.75;flex:1 1 220px}
#map{flex:1;min-height:0;width:100%}
#map.draw,#map.draw .leaflet-grab,#map.draw .leaflet-interactive{cursor:crosshair!important}
.tm{background:none;border:0}
.lbl{font-weight:600;background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.lbl::before{display:none}
#dlg{position:fixed;inset:12% 5%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:2000}
#dlg textarea{flex:1;font:12px/1.4 ui-monospace,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;resize:none}
</style>
</head>
<body>
<div id="home"><h1>404</h1><p>Nada por aqui.</p></div>

<div id="app" hidden>
  <div class="bar">
    <div class="grp" id="tools">
      <button data-t="move">Mover</button>
      <button data-t="area">Área</button>
      <button data-t="unit">Tropa</button>
    </div>
    <div class="grp" id="sws"></div>
    <div class="grp">
      <select id="utype" aria-label="Tipo de tropa">
        <option value="inf">Infantaria</option>
        <option value="cav">Cavalaria</option>
        <option value="art">Artilharia</option>
        <option value="nav">Frota</option>
        <option value="fort">Forte</option>
      </select>
      <input type="text" id="label" placeholder="Nome ou efetivo" aria-label="Nome">
    </div>
    <div class="grp">
      <button id="finish">Fechar área</button>
      <button id="del">Apagar</button>
      <button id="io">Salvar / carregar</button>
      <button id="copy">Copiar link</button>
    </div>
    <span id="st"></span>
    <span id="hint"></span>
  </div>
  <div id="map"></div>
  <div id="dlg" hidden>
    <div>Copie este texto para guardar um backup da sala, ou cole um texto salvo e clique em Carregar. Carregar substitui tudo na sala, para todos.</div>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="grp"><button id="load">Carregar</button><button id="close">Fechar</button></div>
  </div>
</div>

<script>
// 1) Cole aqui os dados do seu projeto Firebase (Configurações do projeto > Seus apps > Web).
//    Enquanto estiver com SEU-PROJETO, o mapa funciona só no seu navegador (modo local de teste).
const FIREBASE_CONFIG = {
  apiKey: 'COLE_AQUI',
  authDomain: 'SEU-PROJETO.firebaseapp.com',
  databaseURL: 'https://SEU-PROJETO-default-rtdb.firebaseio.com',
  projectId: 'SEU-PROJETO',
  appId: 'COLE_AQUI'
};

// 2) Opcional: chave gratuita da CARTO (carto.com/basemaps/apikey). Pode deixar vazio e usar o OpenStreetMap.
const CARTO_KEY = 'cb1_5ack_1_983b3c890934bca3ea032dfe';

const $ = s => document.querySelector(s);
const online = !/SEU-PROJETO/.test(FIREBASE_CONFIG.databaseURL);
const COLORS = ['#d93a3a', '#2f6fdd', '#2e9e5b', '#e2a823', '#8e44ad', '#e67e22', '#16a2a8', '#6b7480'];
const SYM = {
  inf: ['M-22-14L22 14M-22 14L22-14', 0],
  cav: ['M-22 14L22-14', 0],
  art: ['M-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0', 1],
  nav: ['M-15 4q7.5-9 15 0t15 0', 0],
  fort: ['M-9-8h18v16h-18z', 1]
};
const HINTS = {
  move: 'Arraste as tropas para mover. Clique numa área ou tropa para editar nome e cor.',
  area: 'Clique no mapa para marcar os vértices. Clique no primeiro ponto, ou em Fechar área, para concluir.',
  unit: 'Escolha o tipo, escreva um nome e clique no mapa para posicionar.'
};
let map, layer, drawL, tool = 'move', color = COLORS[0], sel = null, draft = [];
let dragging = false, lastDrag = 0, room = null, ref = null;
let R = { areas: {}, units: {} };   // estado da sala: areas/{id} e units/{id}

const col = k => k === 'a' ? 'areas' : 'units';
const get = s => R[col(s.k)][s.id];
const sp = f => col(sel.k) + '/' + sel.id + '/' + f;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const lkey = () => 'mg-room-' + room;

function norm(d) {
  R = { areas: (d && d.areas) || {}, units: (d && d.units) || {} };
  if (sel && !get(sel)) { sel = null; $('#label').value = ''; }
}
// Grava um valor (ou apaga, com null). Online vai para o Firebase; no modo local, para o navegador.
function W(path, v) {
  if (online) { ref.child(path).set(v); return; }
  const k = path.split('/'); let o = R;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]] = o[k[i]] || {};
  if (v === null) delete o[k[k.length - 1]]; else o[k[k.length - 1]] = v;
  try { localStorage.setItem(lkey(), JSON.stringify(R)); } catch (e) {}
  if (!dragging) render();
}

function connect(r) {
  if (ref) { ref.off(); ref = null; }
  room = r; sel = null; draft = []; $('#label').value = '';
  $('#st').textContent = 'Sala: ' + r + (online ? ' (ao vivo)' : ' (modo local de teste)');
  if (online) {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    ref = firebase.database().ref('rooms/' + r);
    ref.on('value', s => { norm(s.val()); if (!dragging) render(); },
      err => { $('#st').textContent = 'Erro de conexão: ' + err.message; });
  } else {
    try { norm(JSON.parse(localStorage.getItem(lkey()) || 'null')); } catch (e) { norm(null); }
    render();
  }
}
// No modo local, outras abas do mesmo navegador também acompanham.
addEventListener('storage', e => {
  if (!online && room && e.key === lkey()) { try { norm(JSON.parse(e.newValue || 'null')); render(); } catch (x) {} }
});

function initMap() {
  map = L.map('map', { doubleClickZoom: false }).setView([51.505, -0.159], 15);
  const osmCredit = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  const carto = '&copy; <a href="https://carto.com/attributions">CARTO</a>';
  // OpenStreetMap só carrega com o site em https (ou http://localhost), nunca com o arquivo aberto direto.
  const fundos = {
    'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: osmCredit }),
    'Satélite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles &copy; Esri' }),
    'Relevo': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { subdomains: 'abc', maxZoom: 17, attribution: osmCredit + ' | &copy; <a href="https://opentopomap.org">OpenTopoMap</a>' })
  };
  // A CARTO agora exige uma chave gratuita. Com a chave preenchida em CARTO_KEY, ela vira o fundo padrão.
  if (CARTO_KEY) fundos['CARTO Voyager'] = L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=' + encodeURIComponent(CARTO_KEY), { maxZoom: 20, attribution: osmCredit + ' ' + carto });
  fundos[CARTO_KEY ? 'CARTO Voyager' : 'OpenStreetMap'].addTo(map);
  L.control.layers(fundos).addTo(map);
  layer = L.layerGroup().addTo(map);
  drawL = L.layerGroup().addTo(map);
  map.on('click', onMap);
}

function icon(u, on) {
  const s = SYM[u.t] || SYM.inf;
  return L.divIcon({
    className: 'tm', iconSize: [48, 32], iconAnchor: [24, 16],
    html: `<svg width="48" height="32" viewBox="-24 -16 48 32"><rect x="-22" y="-14" width="44" height="28" rx="3" fill="${u.c}" stroke="${on ? '#ffd400' : '#fff'}" stroke-width="${on ? 3.5 : 2}"/><path d="${s[0]}" stroke="#fff" stroke-width="2.5" fill="${s[1] ? '#fff' : 'none'}"/></svg>`
  });
}

function render() {
  if (!map) return;
  layer.clearLayers(); drawL.clearLayers();
  for (const [id, a] of Object.entries(R.areas)) {
    if (!a || !a.p) continue;
    const on = sel && sel.k === 'a' && sel.id === id;
    const p = L.polygon(a.p, { color: a.c, fillColor: a.c, fillOpacity: .35, weight: on ? 5 : 3, dashArray: on ? '8 6' : null }).addTo(layer);
    if (a.l) p.bindTooltip(a.l, { permanent: true, direction: 'center', className: 'lbl' });
    p.on('click', e => hit(e, { k: 'a', id }));
  }
  for (const [id, u] of Object.entries(R.units)) {
    if (!u || !u.ll) continue;
    const on = sel && sel.k === 'u' && sel.id === id;
    const m = L.marker(u.ll, { icon: icon(u, on), draggable: tool === 'move' }).addTo(layer);
    if (u.l) m.bindTooltip(u.l, { permanent: true, direction: 'bottom', offset: [0, 14], className: 'lbl' });
    m.on('click', e => hit(e, { k: 'u', id }));
    m.on('dragstart', () => { dragging = true; });
    m.on('drag', () => {   // os outros veem a tropa se mexendo enquanto você arrasta
      const n = Date.now();
      if (n - lastDrag > 120) { lastDrag = n; const q = m.getLatLng(); W('units/' + id + '/ll', [q.lat, q.lng]); }
    });
    m.on('dragend', () => { dragging = false; const q = m.getLatLng(); W('units/' + id + '/ll', [q.lat, q.lng]); });
  }
  if (draft.length) {   // o rascunho da área é só seu até você fechar
    L.polyline(draft, { color, weight: 3, dashArray: '6 4', interactive: false }).addTo(drawL);
    draft.forEach((q, i) => {
      const first = i === 0 && draft.length > 2;
      const c = L.circleMarker(q, { radius: i ? 5 : 9, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1, interactive: first }).addTo(drawL);
      if (first) c.on('click', e => { L.DomEvent.stopPropagation(e); finish(); });
    });
  }
}

function hit(e, s) {
  L.DomEvent.stopPropagation(e);
  if (tool === 'move') select(s); else onMap(e);
}
function onMap(e) {
  const ll = [e.latlng.lat, e.latlng.lng];
  if (tool === 'area') { draft.push(ll); render(); }
  else if (tool === 'unit') {
    W('units/' + newId(), { ll, t: $('#utype').value, c: color, l: $('#label').value });
    $('#label').value = '';
  } else select(null);
}
function select(s) { sel = s; $('#label').value = s ? (get(s).l || '') : ''; render(); }
function setTool(t) {
  if (sel) $('#label').value = '';
  tool = t; draft = []; sel = null;
  document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('act', b.dataset.t === t));
  $('#finish').hidden = t !== 'area';
  $('#hint').textContent = HINTS[t];
  $('#map').classList.toggle('draw', t !== 'move');
  render();
}
function finish() {
  if (draft.length > 2) {
    W('areas/' + newId(), { p: draft, c: color, l: $('#label').value });
    $('#label').value = '';
  }
  draft = []; render();
}
function del() {
  if (!sel) return;
  const s = sel; sel = null; $('#label').value = '';
  W(col(s.k) + '/' + s.id, null); render();
}

$('#tools').addEventListener('click', e => { if (e.target.dataset.t) setTool(e.target.dataset.t); });
COLORS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'sw' + (i ? '' : ' sel'); b.style.background = c; b.setAttribute('aria-label', 'Cor ' + (i + 1));
  b.onclick = () => {
    color = c;
    document.querySelectorAll('.sw').forEach(x => x.classList.toggle('sel', x === b));
    if (sel) W(sp('c'), c);
  };
  $('#sws').append(b);
});
$('#label').addEventListener('input', e => { if (sel) W(sp('l'), e.target.value); });
$('#utype').addEventListener('change', e => { if (sel && sel.k === 'u') W(sp('t'), e.target.value); });
$('#finish').onclick = finish;
$('#del').onclick = del;
$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $('#copy').textContent = 'Copiado'; setTimeout(() => { $('#copy').textContent = 'Copiar link'; }, 1500); }
  catch (e) { prompt('Copie o link:', location.href); }
};
$('#io').onclick = () => { $('#json').value = JSON.stringify(R); $('#dlg').hidden = false; $('#json').select(); };
$('#close').onclick = () => { $('#dlg').hidden = true; };
$('#load').onclick = () => {
  try {
    const d = JSON.parse($('#json').value);
    const n = { areas: d.areas || {}, units: d.units || {} };
    if (online) ref.set(n);
    else { norm(n); try { localStorage.setItem(lkey(), JSON.stringify(R)); } catch (x) {} render(); }
    $('#dlg').hidden = true;
  } catch (x) { alert('Texto inválido. Cole exatamente o que foi copiado em Salvar.'); }
};
addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'Enter' && tool === 'area') finish();
  if (e.key === 'Escape') { draft = []; render(); }
  if (e.key === 'Delete' || e.key === 'Backspace') del();
});

// Tudo que vier depois do # na URL é o nome da sala. Sem nada depois do #, aparece só o 404.
function roomName() {
  try { return decodeURIComponent(location.hash.slice(1)).trim().toLowerCase().replace(/[.#$\[\]\/\s]+/g, '-').slice(0, 60); }
  catch (e) { return ''; }
}
function route() {
  const r = roomName();
  $('#app').hidden = !r; $('#home').hidden = !!r;
  if (!r) { if (ref) { ref.off(); ref = null; } room = null; return; }
  if (!map) initMap(); else map.invalidateSize();
  if (r !== room) connect(r);
}
addEventListener('hashchange', route);

setTool('move'); route();
</script>
</body>
</html>
